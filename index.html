<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to
         activate at all on iOS — without it, the notch/Dynamic
         Island/home-indicator insets are simply zero. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#163a2b" />
    <!-- iOS ignores the manifest's display/theme fields for these specific
         behaviors — it needs its own meta tags for standalone mode, status
         bar treatment, and the name shown under the home-screen icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="States &amp; Swaad" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>States&amp;Swaad | Authentic Indian Food</title>
    <meta
      name="description"
      content="Homemade South Indian breakfast in Mumbai — podi idli, dosa, tiffins, combos and more, made fresh to order and delivered locally. Order in seconds on WhatsApp."
    />
    <link rel="canonical" href="https://www.statesandswaad.in/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="States&Swaad" />
    <meta property="og:title" content="States&Swaad | Authentic Indian Food" />
    <meta
      property="og:description"
      content="Homemade South Indian breakfast in Mumbai — made fresh to order, delivered locally. Order in seconds on WhatsApp."
    />
    <meta property="og:image" content="https://www.statesandswaad.in/og-image.jpg" />
    <meta property="og:url" content="https://www.statesandswaad.in/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="States&Swaad | Authentic Indian Food" />
    <meta
      name="twitter:description"
      content="Homemade South Indian breakfast in Mumbai — made fresh to order, delivered locally."
    />
    <meta name="twitter:image" content="https://www.statesandswaad.in/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
