name: Build Android APK

# Manual trigger only — this does not run on every push, so it never
# interferes with the website's own deploy (Netlify builds straight from
# the repo independently of this workflow). Run it from the Actions tab
# whenever you want a fresh APK to sideload.
on:
  workflow_dispatch:

# Needed so the "ensure a stable debug keystore" step below can commit the
# keystore back to the repo the first time it generates one.
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project with the latest web build
        run: npx cap sync android

      - name: Ensure a stable debug keystore exists
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v -keystore android/app/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Podi Kitchen Debug, O=Podi Kitchen, C=IN"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/debug.keystore
            git commit -m "Add stable debug keystore for consistent APK signing across builds"
            git push
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: podi-kitchen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
